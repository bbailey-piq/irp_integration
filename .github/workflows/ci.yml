name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extra
        run: pip install ".[test]"

      - name: Smoke test - verify import
        run: python -c "from irp_integration import IRPClient; print(f'irp_integration imported successfully on Python {__import__(\"sys\").version}')"

      # Blocking. The suite is offline — no test builds a real Client — so it
      # needs no RISK_MODELER_* variables and no tenant access.
      - name: Unit tests
        run: pytest

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Advisory only: surfaces type/docstring issues without blocking the PR.
    # Promote to a required check once the codebase is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extra
        run: pip install ".[dev]"

      - name: Type check (mypy)
        run: mypy irp_integration

      - name: Docstring lint (ruff)
        run: ruff check irp_integration

  docs:
    name: Docs in sync
    runs-on: ubuntu-latest
    # Blocking (no continue-on-error): the "generated, can't drift" guarantee is
    # only real if a stale docs/api.md actually fails the PR.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev + databridge extras
        # pdoc imports every module to introspect it, so optional-dependency
        # modules (databridge → pandas/numpy/pyodbc) must be importable too.
        run: pip install ".[dev,databridge]"

      - name: Regenerate API docs
        run: python docs/generate_api_docs.py

      - name: Fail if docs/api.md is stale
        run: |
          git diff --exit-code docs/api.md \
            || { echo "::error::docs/api.md is out of date. Run 'python docs/generate_api_docs.py' and commit the result."; exit 1; }
