[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irp-integration"
dynamic = ["version"]
description = "Python client library for Moody's Intelligent Risk Platform (IRP) APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ben Bailey", email = "bbailey@premiumiq.com" },
    { name = "Anil Venugopal", email = "avenugopal@premiumiq.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "boto3>=1.26.0",
]

[project.optional-dependencies]
databridge = ["pyodbc>=4.0.0", "pandas>=1.5.0", "numpy>=1.23.0"]
# docs/api.md is committed and CI fails on drift, so every input to the
# generator must be reproducible across machines. pdoc is pinned, and pandas/numpy
# are pinned too because pdoc renders their type annotations and the rendered
# module paths shift between releases (see _normalize_types in the generator).
# These pins only apply to the doc/dev toolchain; the databridge extra keeps its
# looser floors for end users.
dev = ["mypy", "ruff", "pytest>=8.0", "pdoc==16.0.*", "pandas==2.3.*", "numpy==2.3.*"]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/premiumiq/irp-integration"
Repository = "https://github.com/premiumiq/irp-integration"
Issues = "https://github.com/premiumiq/irp-integration/issues"

[tool.setuptools.packages.find]
include = ["irp_integration*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is offline: no test constructs a real Client, so none of the
# RISK_MODELER_* variables are read. A developer's populated .env cannot change a
# result, and CI needs no secrets to run it.
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff.lint]
# pydocstyle (D) rules, Google convention. Whole-package rules that would flag
# every module (D100/D104) and the summary-placement rules that conflict with
# this project's "summary on the second line" style (D203/D212/D213) are
# ignored so the focus stays on Args/Returns/Raises docstring accuracy
# (e.g. D417 undocumented-param).
select = ["D"]
ignore = ["D100", "D104", "D203", "D212", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
